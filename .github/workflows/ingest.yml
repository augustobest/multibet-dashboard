name: Ingest Smartico + Meta → Supabase

on:
  schedule:
    # 11:00 UTC = 08:00 BR — captura overnight + começa o dia atualizado
    - cron: '0 11 * * *'
    # 02:59 UTC = 23:59 BR — captura o dia BR praticamente fechado
    - cron: '59 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Quantos dias para trás (ignora se preencher from/to)'
        required: false
        default: '2'
      date_from:
        description: 'Data inicial YYYY-MM-DD (opcional)'
        required: false
      date_to:
        description: 'Data final YYYY-MM-DD (opcional, default hoje)'
        required: false
      client:
        description: 'Slug de cliente específico (vazio = todos ativos)'
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install supabase>=2.9.0 requests

      - name: Run ingest
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            ARGS="--from ${{ github.event.inputs.date_from }}"
            if [ -n "${{ github.event.inputs.date_to }}" ]; then
              ARGS="$ARGS --to ${{ github.event.inputs.date_to }}"
            fi
          else
            ARGS="--days ${{ github.event.inputs.days || '2' }}"
          fi
          if [ -n "${{ github.event.inputs.client }}" ]; then
            ARGS="$ARGS --client ${{ github.event.inputs.client }}"
          fi
          python ingest.py $ARGS
