name: Ingest Smartico + Meta → Supabase

on:
  schedule:
    # Roda às 11:00 UTC (08:00 horário de Brasília) todo dia
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Quantos dias para trás (ignora se preencher from/to)'
        required: false
        default: '2'
      date_from:
        description: 'Data inicial YYYY-MM-DD (opcional)'
        required: false
      date_to:
        description: 'Data final YYYY-MM-DD (opcional, default hoje)'
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install supabase>=2.9.0 requests

      - name: Run ingest
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMARTICO_KEY:          ${{ secrets.SMARTICO_KEY }}
          META_ACCESS_TOKEN:     ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            python ingest.py --from "${{ github.event.inputs.date_from }}" ${{ github.event.inputs.date_to && format('--to {0}', github.event.inputs.date_to) || '' }}
          else
            python ingest.py --days ${{ github.event.inputs.days || '2' }}
          fi
